[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "itmo-aimedicine"
version = "0.1.0"
description = "ITMO research prototype: longitudinal adult therapy workflow and Gemini/Gemma evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "markdown>=3.7,<4"]
research = ["pypdf==6.10.0"]

[project.scripts]
aimedicine-smoke = "itmo_aimedicine.cli:main"

[tool.setuptools.packages.find]
include = ["itmo_aimedicine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
